{% extends "layouts/base.html" %}
{% block content %}
<!-- Google Fonts: Permanent Marker & Montserrat -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
    .upload-data-container .page-card { background:#fff; border:1px solid #c8d6e8; border-radius:8px; max-width:900px; margin:24px auto; box-shadow:0 3px 10px rgba(0,0,0,0.1); overflow:hidden; font-family:'Montserrat',sans-serif; }
    .upload-data-container .card-header { background:#2E266D; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-radius:6px 6px 0 0; }
    .upload-data-container .card-header h2 { font-family:'Permanent Marker',cursive; color:#fff; font-size:1.5rem; margin:0; }
    .upload-data-container .card-body { padding:28px 30px; }
    .upload-data-container .row { display: flex; align-items: center; margin-bottom: 18px; }
    .upload-data-container label { width: 200px; font-weight: 700; font-size: 14px; color: #333; font-family:'Montserrat',sans-serif; }
    .upload-data-container select, .upload-data-container input { flex: 1; height: 36px; padding: 6px 10px; font-size: 14px; border: 1px solid #c8d6e8; border-radius: 5px; font-family:'Montserrat',sans-serif; }
    .upload-data-container select:focus, .upload-data-container input:focus { outline:none; border-color:#2E266D; box-shadow:0 0 0 2px rgba(46,38,109,0.15); }
    .upload-data-container .btn, .upload-data-container .green-btn { background:#FF3131 !important; color:white !important; border:2px solid #2E266D !important; padding:8px 20px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; font-family:'Montserrat',sans-serif; transition:background 0.2s; margin-left:8px; }
    .upload-data-container .btn:hover, .upload-data-container .green-btn:hover { background:#e02525 !important; box-shadow:0 2px 6px rgba(46,38,109,0.35); }
    .upload-data-container .section-title { font-size:15px; font-weight:700; margin:22px 0 12px; color:#2E266D; text-transform:uppercase; letter-spacing:.4px; border-bottom:2px solid #2E266D; padding-bottom:4px; }
    .upload-data-container .link-group { display:flex; gap:20px; margin-top:12px; }
    .upload-data-container .link-group a { color:#2E266D; font-weight:700; text-decoration:none; font-size:14px; }
    .upload-data-container .link-group a:hover { text-decoration:underline; }
</style>

<div class="upload-data-container pb-4">
<div class="page-card">
  <div class="card-header"><h2>Upload Data</h2></div>
  <div class="card-body">
    <!-- Customer Code -->
    <div class="row">
        <label>Select Customer Code:</label>
        <select id="cmbBox_CustCode">
            <option value="">-- Select Customer --</option>
            <option value="ALL">ALL</option>
            {% for cid in customers %}
            <option value="{{ cid }}">{{ cid }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- BOM Part Details -->
    <div class="section-title">BOM Part Details - Master</div>
    <div class="row">
        <label>File Path:</label>
        <input type="text" placeholder="Enter file path">
        <button class="green-btn">Update</button>
    </div>

    <!-- Links -->
    <div class="link-group">
        <a href="#">Download Data</a>
        <a href="#">Download Template</a>
    </div>
  </div><!-- /card-body -->
</div><!-- /page-card -->
</div><!-- /upload-data-container -->
{% endblock %}
