{% extends "layouts/base.html" %}
{% block content %}
<!-- Google Fonts: Permanent Marker & Montserrat -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
    .todo-container .page-card { background:#fff; border:1px solid #c8d6e8; border-radius:8px; max-width:900px; margin:24px auto; box-shadow:0 3px 10px rgba(0,0,0,0.1); overflow:hidden; font-family:'Montserrat',sans-serif; }
    .todo-container .card-header { background:#2E266D; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-radius:6px 6px 0 0; }
    .todo-container .card-header h2 { font-family:'Permanent Marker',cursive; color:#fff; font-size:1.5rem; margin:0; background:none; padding:0; }
    .todo-container .card-body { padding:28px 30px; }
    .todo-container .row { display: flex; align-items: center; margin-bottom: 18px; }
    .todo-container label { width: 200px; font-weight: 700; font-size: 14px; color: #333; font-family:'Montserrat',sans-serif; }
    .todo-container select, .todo-container input { flex: 1; height: 36px; padding: 6px 10px; font-size: 14px; border: 1px solid #c8d6e8; border-radius: 5px; font-family:'Montserrat',sans-serif; }
    .todo-container select:focus, .todo-container input:focus { outline:none; border-color:#2E266D; box-shadow:0 0 0 2px rgba(46,38,109,0.15); }
    .todo-container .btn-group { margin: 22px 0; display: flex; gap: 12px; flex-wrap: wrap; }
    .todo-container .btn { background:#FF3131 !important; color:white !important; border:2px solid #2E266D !important; padding:8px 22px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; font-family:'Montserrat',sans-serif; transition:background 0.2s, box-shadow 0.2s; }
    .todo-container .btn:hover { background:#e02525 !important; box-shadow:0 2px 6px rgba(46,38,109,0.35); }
    .todo-container .export-btn { background:#FF3131 !important; color:white !important; border:2px solid #2E266D !important; padding:8px 18px; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600; font-family:'Montserrat',sans-serif; transition:background 0.2s; }
    .todo-container .export-btn:hover { background:#e02525 !important; box-shadow:0 2px 6px rgba(46,38,109,0.35); }
    .todo-container .hidden { display: none !important; }
    .todo-container #banner { padding: 10px; margin-bottom: 16px; border-radius: 4px; display: none; font-weight: bold; }
    .todo-container .banner-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .todo-container .banner-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>

<div class="todo-container pb-4">
<div class="page-card">
  <div class="card-header"><h2>TO DO LIST</h2></div>
  <div class="card-body">

<div id="banner"></div>

    <div class="row">
        <label>Customer ID :</label>
        <select id="cmbBox_CustomerID" onchange="updateCustomerName()">
            <option value="">Select ID</option>
            {% for cust in customers %}
                <option value="{{ cust.customer_id }}" data-name="{{ cust.name }}">{{ cust.customer_id }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <label>Customer Name :</label>
        <input type="text" id="txtBox_Name" readonly style="background-color: #e9ecef;">
    </div>

    <div class="row">
        <label>Item No :</label>
        <select id="Cmb_SearchItem" onchange="checkProjectType()">
            <option value="">Select Item</option>
        </select>
    </div>

    <div class="btn-group">
        <button id="cmd_Email" class="btn" onclick="sendEmail()">Send Email</button>
        <button id="Cmd_ToDoListSimple" class="btn hidden">To Do List Simple</button>
        <button id="cmd_todoNormal" class="btn hidden">To Do List Normal</button>
        <button id="cmd_todoComplex" class="btn hidden">To Do List Complex</button>
    </div>

    <div class="row">
        <label>To-Do List Type (Export):</label>
        <select id="Cmb_ToDoList">
            <option value="">Select Status</option>
            <option value="Simple">Simple Projects</option>
            <option value="Normal">Normal Projects</option>
            <option value="Complex">Complex Projects</option>
        </select>
        <button class="export-btn" onclick="exportToDo()">Export Pending To-Do Dump</button>
    </div>
</div><!-- /card-body -->
</div><!-- /page-card -->

<script>
    function getCsrfToken() {
        return document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
    }
    
    function showBanner(message, isError) {
        const banner = document.getElementById("banner");
        banner.textContent = message;
        banner.className = isError ? "banner-error" : "banner-success";
        banner.style.display = "block";
        setTimeout(() => { banner.style.display = "none"; }, 5000);
    }

    function updateCustomerName() {
        var select = document.getElementById("cmbBox_CustomerID");
        var nameInput = document.getElementById("txtBox_Name");
        if(select.selectedIndex > 0) {
            nameInput.value = select.options[select.selectedIndex].getAttribute("data-name") || "";
            loadItemsByCustomer(select.value);
        } else {
            nameInput.value = "";
            resetItemDropdown();
        }
    }

    function resetItemDropdown() {
        var itemSelect = document.getElementById("Cmb_SearchItem");
        itemSelect.innerHTML = '<option value="">Select Item</option>';
        // Hide all todo buttons
        document.getElementById("Cmd_ToDoListSimple").classList.add("hidden");
        document.getElementById("cmd_todoNormal").classList.add("hidden");
        document.getElementById("cmd_todoComplex").classList.add("hidden");
    }

    function loadItemsByCustomer(customerId) {
        resetItemDropdown();
        if (!customerId) return;

        var itemSelect = document.getElementById("Cmb_SearchItem");
        itemSelect.innerHTML = '<option value="">Loading...</option>';

        fetch(`/todo/api/get_items_by_customer/?customer_id=${encodeURIComponent(customerId)}`)
            .then(r => r.json())
            .then(data => {
                itemSelect.innerHTML = '<option value="">Select Item</option>';
                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        var opt = document.createElement('option');
                        opt.value = item;
                        opt.textContent = item;
                        itemSelect.appendChild(opt);
                    });
                } else {
                    itemSelect.innerHTML = '<option value="">No items found</option>';
                }
            })
            .catch(err => {
                console.error(err);
                itemSelect.innerHTML = '<option value="">Error loading items</option>';
            });
    }

    function checkProjectType() {
        var itemNo = document.getElementById("Cmb_SearchItem").value;
        var btnSimple = document.getElementById("Cmd_ToDoListSimple");
        var btnNormal = document.getElementById("cmd_todoNormal");
        var btnComplex = document.getElementById("cmd_todoComplex");
        
        btnSimple.classList.add("hidden");
        btnNormal.classList.add("hidden");
        btnComplex.classList.add("hidden");
        
        if(!itemNo) return;
        
        fetch(`/todo/api/get_project_type/?item_no=${encodeURIComponent(itemNo)}`)
            .then(r => r.json())
            .then(data => {
                if(data.error) {
                    showBanner(data.error, true);
                } else if(data.project_type) {
                    if (data.project_type === "Complex Projects") {
                        btnComplex.classList.remove("hidden");
                        document.getElementById("Cmb_ToDoList").value = "Complex";
                    } else if (data.project_type === "Normal Projects") {
                        btnNormal.classList.remove("hidden");
                        document.getElementById("Cmb_ToDoList").value = "Normal";
                    } else if (data.project_type === "Simple Projects") {
                        btnSimple.classList.remove("hidden");
                        document.getElementById("Cmb_ToDoList").value = "Simple";
                    }
                }
            })
            .catch(err => console.error(err));
    }

    function sendEmail() {
        var customerId = document.getElementById("cmbBox_CustomerID").value;
        if (!customerId) {
            showBanner("Please select a Customer ID first.", true);
            return;
        }
        
        fetch('/todo/api/email_todo/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ customer_id: customerId })
        })
        .then(r => r.json())
        .then(data => {
            if(data.success) {
                showBanner(data.message, false);
                alert(data.message || "Email sent successfully!");
            } else {
                showBanner("Error: " + data.error, true);
                alert("Error: " + data.error);
            }
        })
        .catch(err => {
            console.error(err);
            showBanner("Failed to send email.", true);
            alert("Failed to send email.");
        });
    }

    function exportToDo() {
        var todoType = document.getElementById("Cmb_ToDoList").value;
        if (!todoType) {
            showBanner("Please select a To-Do List Type first.", true);
            return;
        }
        
        // Use browser navigation to trigger file download
        window.location.href = `/todo/api/export_todo/?type=${encodeURIComponent(todoType)}`;
    }
</script>
</div><!-- /todo-container -->
{% endblock %}
