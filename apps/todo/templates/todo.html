{% extends "layouts/base.html" %}
{% block content %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To Do List</title>
<style>
    body { font-family: Arial, sans-serif; background-color: #f9f9f9; margin: 0; padding: 0; }
    h2 { background-color: #2a6ebb; color: white; padding: 16px 24px; font-size: 22px; margin: 0; }
    .form-section { background-color: #ffffff; border: 1px solid #ddd; border-radius: 8px; padding: 30px; max-width: 900px; margin: 30px auto; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    .row { display: flex; align-items: center; margin-bottom: 20px; }
    label { width: 180px; font-weight: bold; font-size: 15px; color: #333; }
    select, input { flex: 1; height: 36px; padding: 6px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; }
    .btn-group { margin: 25px 0; display: flex; gap: 15px; flex-wrap: wrap; }
    .btn { background-color: #2a6ebb; color: white; border: none; padding: 10px 24px; border-radius: 5px; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn:hover { background-color: #1f4f8a; }
    .export-btn { background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .export-btn:hover { background-color: #218838; }
    .hidden { display: none !important; }
    #banner { padding: 10px; margin-bottom: 20px; border-radius: 4px; display: none; font-weight: bold; }
    .banner-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .banner-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>
</head>
<body>

<h2>TO DO LIST</h2>

<div class="form-section">
    <div id="banner"></div>

    <div class="row">
        <label>Customer ID :</label>
        <select id="cmbBox_CustomerID" onchange="updateCustomerName()">
            <option value="">Select ID</option>
            {% for cust in customers %}
                <option value="{{ cust.customer_id }}" data-name="{{ cust.name }}">{{ cust.customer_id }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="row">
        <label>Customer Name :</label>
        <input type="text" id="txtBox_Name" readonly style="background-color: #e9ecef;">
    </div>

    <div class="row">
        <label>Item No :</label>
        <select id="Cmb_SearchItem" onchange="checkProjectType()">
            <option value="">Select Item</option>
        </select>
    </div>

    <div class="btn-group">
        <button id="cmd_Email" class="btn" onclick="sendEmail()">Send Email</button>
        <button id="Cmd_ToDoListSimple" class="btn hidden">To Do List Simple</button>
        <button id="cmd_todoNormal" class="btn hidden">To Do List Normal</button>
        <button id="cmd_todoComplex" class="btn hidden">To Do List Complex</button>
    </div>

    <div class="row">
        <label>To-Do List Type (Export):</label>
        <select id="Cmb_ToDoList">
            <option value="">Select Status</option>
            <option value="Simple">Simple Projects</option>
            <option value="Normal">Normal Projects</option>
            <option value="Complex">Complex Projects</option>
        </select>
        <button class="export-btn" onclick="exportToDo()">Export Pending To-Do Dump</button>
    </div>
</div>

<script>
    function getCsrfToken() {
        return document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1];
    }
    
    function showBanner(message, isError) {
        const banner = document.getElementById("banner");
        banner.textContent = message;
        banner.className = isError ? "banner-error" : "banner-success";
        banner.style.display = "block";
        setTimeout(() => { banner.style.display = "none"; }, 5000);
    }

    function updateCustomerName() {
        var select = document.getElementById("cmbBox_CustomerID");
        var nameInput = document.getElementById("txtBox_Name");
        if(select.selectedIndex > 0) {
            nameInput.value = select.options[select.selectedIndex].getAttribute("data-name") || "";
            loadItemsByCustomer(select.value);
        } else {
            nameInput.value = "";
            resetItemDropdown();
        }
    }

    function resetItemDropdown() {
        var itemSelect = document.getElementById("Cmb_SearchItem");
        itemSelect.innerHTML = '<option value="">Select Item</option>';
        // Hide all todo buttons
        document.getElementById("Cmd_ToDoListSimple").classList.add("hidden");
        document.getElementById("cmd_todoNormal").classList.add("hidden");
        document.getElementById("cmd_todoComplex").classList.add("hidden");
    }

    function loadItemsByCustomer(customerId) {
        resetItemDropdown();
        if (!customerId) return;

        var itemSelect = document.getElementById("Cmb_SearchItem");
        itemSelect.innerHTML = '<option value="">Loading...</option>';

        fetch(`/todo/api/get_items_by_customer/?customer_id=${encodeURIComponent(customerId)}`)
            .then(r => r.json())
            .then(data => {
                itemSelect.innerHTML = '<option value="">Select Item</option>';
                if (data.items && data.items.length > 0) {
                    data.items.forEach(item => {
                        var opt = document.createElement('option');
                        opt.value = item;
                        opt.textContent = item;
                        itemSelect.appendChild(opt);
                    });
                } else {
                    itemSelect.innerHTML = '<option value="">No items found</option>';
                }
            })
            .catch(err => {
                console.error(err);
                itemSelect.innerHTML = '<option value="">Error loading items</option>';
            });
    }

    function checkProjectType() {
        var itemNo = document.getElementById("Cmb_SearchItem").value;
        var btnSimple = document.getElementById("Cmd_ToDoListSimple");
        var btnNormal = document.getElementById("cmd_todoNormal");
        var btnComplex = document.getElementById("cmd_todoComplex");
        
        btnSimple.classList.add("hidden");
        btnNormal.classList.add("hidden");
        btnComplex.classList.add("hidden");
        
        if(!itemNo) return;
        
        fetch(`/todo/api/get_project_type/?item_no=${encodeURIComponent(itemNo)}`)
            .then(r => r.json())
            .then(data => {
                if(data.error) {
                    showBanner(data.error, true);
                } else if(data.project_type) {
                    if (data.project_type === "Complex Projects") {
                        btnComplex.classList.remove("hidden");
                        document.getElementById("Cmb_ToDoList").value = "Complex";
                    } else if (data.project_type === "Normal Projects") {
                        btnNormal.classList.remove("hidden");
                        document.getElementById("Cmb_ToDoList").value = "Normal";
                    } else if (data.project_type === "Simple Projects") {
                        btnSimple.classList.remove("hidden");
                        document.getElementById("Cmb_ToDoList").value = "Simple";
                    }
                }
            })
            .catch(err => console.error(err));
    }

    function sendEmail() {
        var customerId = document.getElementById("cmbBox_CustomerID").value;
        if (!customerId) {
            showBanner("Please select a Customer ID first.", true);
            return;
        }
        
        fetch('/todo/api/email_todo/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken()
            },
            body: JSON.stringify({ customer_id: customerId })
        })
        .then(r => r.json())
        .then(data => {
            if(data.success) {
                showBanner(data.message, false);
            } else {
                showBanner("Error: " + data.error, true);
            }
        })
        .catch(err => {
            console.error(err);
            showBanner("Failed to send email.", true);
        });
    }

    function exportToDo() {
        var todoType = document.getElementById("Cmb_ToDoList").value;
        if (!todoType) {
            showBanner("Please select a To-Do List Type first.", true);
            return;
        }
        
        // Use browser navigation to trigger file download
        window.location.href = `/todo/api/export_todo/?type=${encodeURIComponent(todoType)}`;
    }
</script>

</body>
</html>
{% endblock %}
